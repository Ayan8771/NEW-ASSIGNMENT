
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 20px;
        }

        .heading {
            color: white;
            background-color: #2563eb;
            text-align: center;
            padding: 15px;
        }

        
        #intro {
            color: #166534;
            font-size: 18px;
            background-color: #dcfce7;
            padding: 12px;
        }

        
        .content p {
            color: #444;
            line-height: 1.6;
        }

        
        h2, h3 {
            color: #7c3aed;
        }
    </style>
</head>

<body>

    <h1 class="heading">CSS Selectors Demonstration</h1>

    <p id="intro">
        Welcome to my webpage! This page demonstrates different
        types of CSS selectors.
    </p>

    <div class="content">
        <h2>About CSS</h2>
        <p>CSS stands for Cascading Style Sheets.</p>
        <p>It is used to style and design HTML webpages.</p>
    </div>

    <h3>Thank You for Visiting!</h3>

</body>
</html>

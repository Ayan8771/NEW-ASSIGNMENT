
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens Demo</title>

    <style>
        /* Design Tokens */
        :root {
            /* Colour variables */
            --primary-color: #2563EB;
            --secondary-color: #0F766E;
            --background-color: #F1F5F9;
            --surface-color: #FFFFFF;
            --text-color: #334155;
            --muted-color: #64748B;

            /* Font-size variables */
            --font-small: 14px;
            --font-medium: 16px;
            --font-large: 24px;
            --font-heading: 32px;

            /* Spacing variables */
            --space-small: 8px;
            --space-medium: 16px;
            --space-large: 24px;
        }

        body {
            margin: 0;
            padding: var(--space-large);
            font-family: Arial, sans-serif;
            font-size: var(--font-medium);
            color: var(--text-color);
            background-color: var(--background-color);
            line-height: 1.6;
        }

        .card {
            max-width: 600px;
            margin: auto;
            padding: var(--space-large);
            background-color: var(--surface-color);
            border-radius: 10px;
        }

        h1 {
            color: var(--primary-color);
            font-size: var(--font-heading);
        }

        h2 {
            color: var(--secondary-color);
            font-size: var(--font-large);
        }

        p {
            font-size: var(--font-medium);
        }

        .note {
            color: var(--muted-color);
            font-size: var(--font-small);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            font-size: var(--font-medium);
            padding: var(--space-small) var(--space-medium);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Design Tokens</h1>
        <h2>Reusable CSS Variables</h2>

        <p>
            Design tokens help maintain consistent colours,
            typography, and spacing throughout a website.
        </p>

        <p class="note">
            This text uses the small font-size token.
        </p>

        <button>Learn More</button>
    </div>
</body>
</html>

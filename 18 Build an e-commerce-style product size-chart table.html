
<!DOCTYPE html>
<html>
<head>
    <title>Product Size Chart</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        p {
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: darkblue;
            color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Product Size Chart</h1>
    <p>Choose the right size for your T-shirt</p>

    <table>
        <tr>
            <th>Size</th>
            <th>Chest (inches)</th>
            <th>Shoulder (inches)</th>
            <th>Length (inches)</th>
        </tr>

        <tr>
            <td>S</td>
            <td>36</td>
            <td>16</td>
            <td>26</td>
        </tr>

        <tr>
            <td>M</td>
            <td>38</td>
            <td>17</td>
            <td>27</td>
        </tr>

        <tr>
            <td>L</td>
            <td>40</td>
            <td>18</td>
            <td>28</td>
        </tr>

        <tr>
            <td>XL</td>
            <td>42</td>
            <td>19</td>
            <td>29</td>
        </tr>

        <tr>
            <td>XXL</td>
            <td>44</td>
            <td>20</td>
            <td>30</td>
        </tr>
    </table>

</body>
</html>

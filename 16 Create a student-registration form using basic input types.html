<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .khan {
            border: 5px solid black;
            padding: 20px;
            margin: 20px;
            width: fit-content;
            text-align: center;
            background-color: #35f49b;
            text-color: rgb(218, 218, 218);

        }

        .heading {
            text-decoration: #e85404;
        }
    </style>
</head>

<body>
    <div class="khan">
        <h1 class="heading">Student ragistration form</h1>

        <form action="/ASSIGNMENT/16 Create a student-registration form using basic input types.html" class="new form"
            method="get">
            <label for="student name">Student Name</label>
            <input type="Student name" id="student name" placeholder="Enter your name">
            <label for="father name ">Father name</label>
            <input type="Father name" id="father name" placeholder="Enter father's name">
            <hr>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <label for="Contact">Contact</label>
            <input type="Contact" id="Contact" placeholder="Enter contact number">
            <hr>
            <label for="Email">Email</label>
            <input type="Email" id="Email" placeholder="Enter email address">
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

            <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
            <br><br>

            <label for="address">Address:</label>
            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">--Select Course--</option>
                <option value="BCA">BCA (AI)</option>
                <option value="BTech">B.Tech</option>
                <option value="BBA">BBA</option>
                <option value="BSc">B.Sc</option>
            </select>
            <br><br>


            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <br>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions.</label>
            <br>
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        

        </form>

    </div>
</body>

</html>
